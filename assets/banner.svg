<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yabsera Teshome, Full-stack developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14183a"/>
      <stop offset="1" stop-color="#2a1458"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- decorative code window -->
    <g transform="translate(820,62)">
      <rect width="320" height="196" rx="12" fill="#0b1020" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="22" cy="22" r="5.5" fill="#fb7185"/>
      <circle cx="42" cy="22" r="5.5" fill="#fbbf24"/>
      <circle cx="62" cy="22" r="5.5" fill="#34d399"/>
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" xml:space="preserve">
        <text x="24" y="64"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> dev </tspan><tspan fill="#94a3b8">= {</tspan></text>
        <text x="44" y="92"><tspan fill="#7dd3fc">name</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Yabsera"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="44" y="120"><tspan fill="#7dd3fc">stack</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"JS/TS/Py"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="44" y="148"><tspan fill="#7dd3fc">focus</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"EdTech"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="24" y="176" fill="#94a3b8">};</text>
      </g>
    </g>

    <!-- text -->
    <text x="70" y="128" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#94a3b8" letter-spacing="6">HELLO, I'M</text>
    <text x="68" y="198" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="url(#accent)">Yabsera Teshome</text>
    <text x="70" y="244" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#cbd5e1">Full-stack developer  ·  EdTech  ·  Automation</text>
    <rect x="70" y="262" width="120" height="4" rx="2" fill="url(#accent)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
